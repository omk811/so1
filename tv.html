case 'reveal':{const k=b.dataset.v;S.open[k]=!S.open[k];b.setAttribute('aria-expanded',String(S.open[k]));b.textContent=S.open[k]?'إخفاء الإجابة':'أظهر إجابة مقترحة';$('ans-'+k).hidden=!S.open[k];if(S.open[k])$('ans-'+k).scrollIntoView({block:'nearest'});break}
case 'read':S.read=n;render();break;case 'verse':S.verse=n;render();break;case 'words':S.words=n;render();break;case 'explain':S.verse=n;go(5);break;
case 'order':if(n===S.order.length){S.order.push(n);S.orderError=false}else S.orderError=true;render(true);$('content').querySelector('[data-a="order"]:not(:disabled)')?.focus();break;case 'orderReset':S.order=[];S.orderError=false;render();break;

case 'plus':S.scale=Math.min(1.4,S.scale+.1);document.documentElement.style.setProperty('--scale',S.scale);break;case 'minus':S.scale=Math.max(.9,S.scale-.1);document.documentElement.style.setProperty('--scale',S.scale);break;case 'theme':document.body.classList.toggle('light');b.setAttribute('aria-pressed',String(document.body.classList.contains('light')));break;
case 'timer':timer();break;case 'full':try{const promise=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();if(promise)promise.catch(()=>$('live').textContent='استخدم وضع ملء الشاشة في المتصفح.');else $('live').textContent='استخدم وضع ملء الشاشة في المتصفح.'}catch(err){$('live').textContent='استخدم وضع ملء الشاشة في المتصفح.'}break;
case 'download':{const blob=new Blob(['<!DOCTYPE html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='suleiman-tv.html';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}
}});
document.addEventListener('change',e=>{if(e.target.matches('[data-check]'))S.checks[e.target.dataset.check]=e.target.checked});
document.addEventListener('keydown',e=>{const opened=!$('overlay').hidden;if(e.key==='Escape'){close();return}if(e.key==='Tab'&&opened){const items=$('overlay').querySelectorAll('button:not(:disabled),a[href]');if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items[items.length-1].focus()}else if(!e.shiftKey&&document.activeElement===items[items.length-1]){e.preventDefault();items[0].focus()}return}if(!opened&&['PageDown','PageUp'].includes(e.key)){e.preventDefault();go(S.page+(e.key==='PageDown'?1:-1));return}if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;const scope=opened?$('overlay'):document,items=[...scope.querySelectorAll('button:not(:disabled),input,a[href]')].filter(x=>x.getClientRects().length&&!x.closest('[hidden]')),r=document.activeElement.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,horizontal=['ArrowLeft','ArrowRight'].includes(e.key),dir=['ArrowLeft','ArrowUp'].includes(e.key)?-1:1;let best=null,score=Infinity;items.forEach(el=>{if(el===document.activeElement)return;const q=el.getBoundingClientRect(),dx=q.left+q.width/2-x,dy=q.top+q.height/2-y,primary=horizontal?dx:dy,side=horizontal?dy:dx;if(primary*dir<=2)return;const s=Math.abs(primary)+Math.abs(side)*3;if(s<score){score=s;best=el}});if(best){e.preventDefault();best.focus();best.scrollIntoView({block:'nearest'})}});
